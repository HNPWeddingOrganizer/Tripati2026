<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Portal TRIPATI DPPI</title>
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/a/a0/Logo_dppi_512.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Premium Earthy Palette */
      --bg-main: #160F0C;
      --glass-bg: rgba(45, 30, 25, 0.45);
      --glass-bg-card: rgba(36, 24, 19, 0.65);
      --glass-border: rgba(244, 215, 125, 0.16);
      --color-primary: #C8963E;
      --color-primary-hover: #A87B32;
      --color-accent: #9D446E;
      --text-main: #F4D77D;
      --text-muted: #D5B992;
      --text-reading: #F5EFE6;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-reading);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    /* --- BACKGROUND ANIMATED SHAPES --- */
    .bg-shapes {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.48;
      animation: float 20s infinite alternate ease-in-out;
    }

    .shape-1 {
      width: 500px;
      height: 500px;
      background: rgba(200, 150, 62, 0.25);
      top: -20%;
      left: -10%;
    }

    .shape-2 {
      width: 400px;
      height: 400px;
      background: rgba(157, 68, 110, 0.25);
      bottom: -10%;
      right: -10%;
      animation-delay: -7s;
    }

    .shape-3 {
      width: 350px;
      height: 350px;
      background: rgba(243, 146, 104, 0.2);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -12s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.1); }
      100% { transform: translate(-40px, 60px) scale(0.9); }
    }

    /* --- GLASSMORPHISM CARD --- */
    .glass-container {
      background: var(--glass-bg-card);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 32px;
      box-shadow: 0 25px 55px -12px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      animation: fadeIn 0.75s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- LOGO & ANIMATED RINGS --- */
    .logo-wrapper {
      position: relative;
      width: 108px;
      height: 108px;
      margin: 0 auto 18px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: contain;
      background-color: rgba(22, 15, 12, 0.85);
      border: 1px solid rgba(244, 215, 125, 0.28);
      padding: 6px;
      box-shadow: 0 8px 30px rgba(200, 150, 62, 0.3);
      position: relative;
      z-index: 2;
    }

    .rings {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(244, 215, 125, 0.12);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .ring-1 {
      width: 102px;
      height: 102px;
      animation: ping-ring 3s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .ring-2 {
      width: 128px;
      height: 128px;
      border-color: rgba(244, 215, 125, 0.06);
      animation: ping-ring 3s cubic-bezier(0, 0, 0.2, 1) infinite;
      animation-delay: 0.55s;
    }

    .ring-3 {
      width: 118px;
      height: 118px;
      border-style: dashed;
      border-color: rgba(244, 215, 125, 0.14);
      animation: spin-slow 16s linear infinite;
    }

    @keyframes ping-ring {
      75%, 100% {
        transform: translate(-50%, -50%) scale(1.4);
        opacity: 0;
      }
    }

    @keyframes spin-slow {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* --- TYPOGRAPHY --- */
    .title-gradient {
      background: linear-gradient(to right, #F4D77D, #C8963E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* --- TABS SWITCHER --- */
    .tabs-wrapper {
      background: rgba(22, 15, 12, 0.58);
      border: 1px solid rgba(244, 215, 125, 0.14);
      border-radius: 100px;
      padding: 4px;
    }

    .tab-btn {
      border-radius: 100px;
      transition: all 0.25s ease;
    }

    .tab-active {
      background: linear-gradient(135deg, #F4D77D 0%, #C8963E 100%);
      color: #160F0C;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(200, 150, 62, 0.3);
    }

    .tab-inactive {
      color: var(--text-muted);
      font-weight: 600;
    }

    .tab-inactive:hover {
      color: var(--text-main);
    }

    /* --- INPUTS --- */
    .input-field {
      background-color: rgba(22, 15, 12, 0.62) !important;
      color: var(--text-reading);
      border: 1.5px solid rgba(244, 215, 125, 0.16) !important;
      border-radius: 16px;
      transition: all 0.25s ease;
    }

    .input-field::placeholder {
      color: rgba(213, 185, 146, 0.45);
    }

    .input-field:focus {
      border-color: var(--color-primary) !important;
      box-shadow: 0 0 0 3px rgba(200, 150, 62, 0.18);
      outline: none;
    }

    /* --- BUTTONS --- */
    .btn-gold {
      background: linear-gradient(135deg, #F4D77D 0%, #C8963E 100%);
      color: #160F0C !important;
      border-radius: 100px;
      font-weight: 700;
      transition: all 0.25s ease;
      box-shadow: 0 12px 28px rgba(200, 150, 62, 0.28);
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(200, 150, 62, 0.44);
      filter: brightness(1.05);
    }

    .btn-outline-gold {
      background: rgba(200, 150, 62, 0.08);
      color: var(--text-main);
      border: 1.5px solid var(--color-primary);
      border-radius: 100px;
      font-weight: 700;
      transition: all 0.25s ease;
    }

    .btn-outline-gold:hover {
      background: linear-gradient(135deg, #F4D77D 0%, #C8963E 100%);
      color: #160F0C;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(200, 150, 62, 0.35);
    }

    .panel-fade {
      animation: panelFade 0.3s ease forwards;
    }

    @keyframes panelFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- SWEETALERT2 EARTHY OVERRIDE --- */
    .swal2-popup {
      background: rgba(34, 22, 18, 0.96) !important;
      border: 1px solid rgba(244, 215, 125, 0.22) !important;
      border-radius: 28px !important;
      color: #F4D77D !important;
      backdrop-filter: blur(20px);
    }

    .swal2-title {
      color: #F4D77D !important;
    }

    .swal2-html-container {
      color: #D5B992 !important;
    }

    /* ============================================================
       CINEMATIC PORTAL TRANSITION OVERLAY (TRIPATI -> BHINNEKASTRA)
       ============================================================ */
    #bhinnekastraPortalOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #F9F1E2;
      background-image: radial-gradient(circle at 50% 0%, rgba(163, 73, 108, 0.14) 0%, transparent 65%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      clip-path: circle(0% at var(--portal-x, 50%) var(--portal-y, 50%));
      transition:
        clip-path 0.85s cubic-bezier(0.76, 0, 0.24, 1),
        opacity 0.25s ease;
    }

    #bhinnekastraPortalOverlay.active {
      pointer-events: auto;
      opacity: 1;
      clip-path: circle(155% at var(--portal-x, 50%) var(--portal-y, 50%));
    }

    .bhinn-bg-shapes {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bhinn-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.65;
      animation: bhinnBlobFloat 12s infinite alternate ease-in-out;
    }

    .bhinn-blob-1 {
      width: 480px;
      height: 480px;
      background: rgba(163, 73, 108, 0.24);
      top: -18%;
      left: -12%;
    }

    .bhinn-blob-2 {
      width: 440px;
      height: 440px;
      background: rgba(223, 190, 141, 0.55);
      bottom: -14%;
      right: -12%;
      animation-delay: -4s;
    }

    .bhinn-blob-3 {
      width: 340px;
      height: 340px;
      background: rgba(200, 150, 62, 0.22);
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -7s;
    }

    @keyframes bhinnBlobFloat {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(45px, 30px) scale(1.12); }
      100% { transform: translate(-35px, 45px) scale(0.92); }
    }

    .bhinn-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .rose-spark {
      position: absolute;
      bottom: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, #A3496C 0%, rgba(223, 190, 141, 0) 70%);
      opacity: 0;
      animation: riseRoseSpark linear infinite;
    }

    @keyframes riseRoseSpark {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.35; }
      100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
    }

    .bhinn-portal-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 410px;
      padding: 42px 28px 36px 28px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid #DFBE8D;
      box-shadow:
        0 28px 65px -15px rgba(84, 58, 42, 0.18),
        0 0 45px rgba(163, 73, 108, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.85);
      text-align: center;
      opacity: 0;
      transform: translateY(28px) scale(0.92);
      transition:
        opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.25s,
        transform 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.25s,
        filter 0.4s ease;
    }

    #bhinnekastraPortalOverlay.active .bhinn-portal-card {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    #bhinnekastraPortalOverlay.warping .bhinn-portal-card {
      opacity: 0;
      transform: scale(1.12);
      filter: blur(10px);
      transition: opacity 0.38s ease, transform 0.38s ease, filter 0.38s ease;
    }

    .bhinn-logo-stage {
      position: relative;
      width: 128px;
      height: 128px;
      margin: 0 auto 24px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bhinn-logo-core {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      object-fit: contain;
      background: #FFFFFF;
      border: 2px solid #DFBE8D;
      padding: 8px;
      position: relative;
      z-index: 3;
      box-shadow: 0 10px 30px rgba(163, 73, 108, 0.24);
      animation: bhinnLogoBreathe 2.4s ease-in-out infinite;
    }

    @keyframes bhinnLogoBreathe {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 26px rgba(163, 73, 108, 0.22); }
      50% { transform: scale(1.05); box-shadow: 0 14px 40px rgba(163, 73, 108, 0.4); }
    }

    .bhinn-ring {
      position: absolute;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .bhinn-ring-ping-1 {
      width: 112px;
      height: 112px;
      border: 1.5px solid rgba(163, 73, 108, 0.35);
      animation: bhinnPing 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .bhinn-ring-ping-2 {
      width: 144px;
      height: 144px;
      border: 1px solid rgba(200, 150, 62, 0.35);
      animation: bhinnPing 2.4s cubic-bezier(0, 0, 0.2, 1) infinite 0.7s;
    }

    .bhinn-ring-orbit {
      width: 124px;
      height: 124px;
      border: 1.5px dashed rgba(163, 73, 108, 0.28);
      animation: bhinnSpin 10s linear infinite;
    }

    .bhinn-ring-arc {
      width: 102px;
      height: 102px;
      border: 2px solid transparent;
      border-top-color: #A3496C;
      border-right-color: rgba(223, 190, 141, 0.75);
      animation: bhinnSpinReverse 1.6s linear infinite;
    }

    @keyframes bhinnPing {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(1.55); opacity: 0; }
    }

    @keyframes bhinnSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes bhinnSpinReverse {
      from { transform: translate(-50%, -50%) rotate(360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }

    .bhinn-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 100px;
      background: rgba(163, 73, 108, 0.1);
      border: 1px solid rgba(163, 73, 108, 0.28);
      color: #A3496C;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .bhinn-title-shimmer {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin: 0 0 8px 0;
      background: linear-gradient(90deg, #543A2A 0%, #A3496C 35%, #C8963E 50%, #A3496C 65%, #543A2A 100%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: bhinnTextShimmer 2.6s linear infinite;
    }

    @keyframes bhinnTextShimmer {
      to { background-position: 220% center; }
    }

    .bhinn-user-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 5px 14px;
      border-radius: 100px;
      background: #EFE4D2;
      border: 1px solid #DFBE8D;
      color: #543A2A;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 22px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bhinn-progress-track {
      width: 100%;
      height: 7px;
      background: #EFE4D2;
      border-radius: 100px;
      overflow: hidden;
      border: 1px solid #DFBE8D;
      margin-bottom: 12px;
      position: relative;
    }

    .bhinn-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 100px;
      background: linear-gradient(90deg, #DFBE8D 0%, #A3496C 55%, #853A55 100%);
      box-shadow: 0 0 14px rgba(163, 73, 108, 0.45);
      transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    .bhinn-progress-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      transform: translateX(-100%);
      animation: bhinnBarShimmer 1.2s infinite;
    }

    @keyframes bhinnBarShimmer {
      100% { transform: translateX(100%); }
    }

    .bhinn-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      gap: 8px;
    }

    #bhinnStatusText {
      color: #886144;
      font-weight: 500;
      text-align: left;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    #bhinnStatusText.switching {
      opacity: 0;
      transform: translateY(4px);
    }

    #bhinnPercentText {
      color: #A3496C;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .bhinn-steps {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
    }

    .bhinn-step-dot {
      width: 8px;
      height: 8px;
      border-radius: 100px;
      background: rgba(163, 73, 108, 0.22);
      transition: all 0.35s ease;
    }

    .bhinn-step-dot.active {
      width: 26px;
      background: linear-gradient(90deg, #A3496C, #C8963E);
      box-shadow: 0 0 10px rgba(163, 73, 108, 0.45);
    }

    .bhinn-step-dot.done {
      background: #A3496C;
    }

    @media (max-width: 480px) {
      .bhinn-portal-card { padding: 34px 22px 28px 22px; }
      .bhinn-title-shimmer { font-size: 21px; }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative">

  <!-- CINEMATIC TRANSITION OVERLAY KEMBALI KE PORTAL BHINNEKASTRA -->
  <div id="bhinnekastraPortalOverlay" aria-hidden="true">
    <div class="bhinn-bg-shapes">
      <div class="bhinn-blob bhinn-blob-1"></div>
      <div class="bhinn-blob bhinn-blob-2"></div>
      <div class="bhinn-blob bhinn-blob-3"></div>
    </div>
    <div class="bhinn-particles" id="bhinnParticles"></div>

    <div class="bhinn-portal-card">
      <div class="bhinn-logo-stage">
        <div class="bhinn-ring bhinn-ring-ping-1"></div>
        <div class="bhinn-ring bhinn-ring-ping-2"></div>
        <div class="bhinn-ring bhinn-ring-orbit"></div>
        <div class="bhinn-ring bhinn-ring-arc"></div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/Logo_DPPI.png" alt="Logo DPPI" class="bhinn-logo-core"
          onerror="this.src='https://placehold.co/100/F9F1E2/A3496C?text=DPPI'">
      </div>

      <div class="bhinn-badge">
        <span class="w-1.5 h-1.5 rounded-full bg-[#A3496C] animate-pulse"></span>
        <span>Kembali ke Portal Utama</span>
      </div>

      <h2 class="bhinn-title-shimmer">PORTAL BHINNEKASTRA</h2>

      <div class="bhinn-user-chip">
        <svg class="w-3.5 h-3.5 text-[#A3496C] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span id="bhinnUserLabel" class="truncate">DPPI Kota Yogyakarta</span>
      </div>

      <div class="bhinn-progress-track">
        <div class="bhinn-progress-fill" id="bhinnProgressFill"></div>
      </div>

      <div class="bhinn-status-row">
        <span id="bhinnStatusText">Menutup sesi Portal TRIPATI...</span>
        <span id="bhinnPercentText">0%</span>
      </div>

      <div class="bhinn-steps">
        <span class="bhinn-step-dot active" id="bStep1"></span>
        <span class="bhinn-step-dot" id="bStep2"></span>
        <span class="bhinn-step-dot" id="bStep3"></span>
      </div>
    </div>
  </div>

  <!-- Background Shapes (Glassmorphism Blobs) -->
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="w-full max-w-md relative z-10 my-4">
    <div class="glass-container p-7 sm:p-8">

      <!-- Logo & Animated Rings -->
      <div class="logo-wrapper">
        <div class="rings ring-1"></div>
        <div class="rings ring-2"></div>
        <div class="rings ring-3"></div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/Logo_DPPI.png" alt="Logo DPPI" class="main-logo"
          onerror="this.src='https://placehold.co/100/160F0C/F4D77D?text=DPPI'">
      </div>

      <!-- Heading -->
      <div class="text-center mb-6">
        <h2 class="text-2xl sm:text-[26px] font-extrabold title-gradient tracking-tight mb-1 uppercase">TRIPATI 2026</h2>
        <p class="text-[#D5B992]/80 text-[11px] font-medium uppercase tracking-[0.18em]">Sistem Seleksi & Evaluasi Terpadu</p>
      </div>

      <!-- TABS SWITCHER -->
      <div class="flex tabs-wrapper mb-6">
        <button type="button" onclick="switchTab('login')" id="tabLogin" class="tab-btn tab-active flex-1 py-2.5 text-xs tracking-wider uppercase">
          Login
        </button>
        <button type="button" onclick="switchTab('daftar')" id="tabDaftar" class="tab-btn tab-inactive flex-1 py-2.5 text-xs tracking-wider uppercase">
          Daftar
        </button>
      </div>

      <!-- FORM LOGIN -->
      <div id="loginSection" class="panel-fade">
        <form id="loginForm" class="space-y-4">
          <div>
            <label for="logNik" class="text-xs font-medium text-[#D5B992] ml-1 mb-1.5 block">NIK / Username</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#C8963E]/80 pointer-events-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </span>
              <input type="text" id="logNik" required placeholder="Masukkan NIK" class="input-field w-full py-3 pl-10 pr-4 text-sm">
            </div>
          </div>

          <div>
            <label for="logPass" class="text-xs font-medium text-[#D5B992] ml-1 mb-1.5 block">Password</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#C8963E]/80 pointer-events-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
              </span>
              <input type="password" id="logPass" required placeholder="Masukkan Password" class="input-field w-full py-3 pl-10 pr-11 text-sm">
              <button type="button" onclick="togglePass('logPass')" aria-label="Tampilkan Password"
                class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[#D5B992]/70 hover:text-[#F4D77D] transition">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-gold w-full py-3.5 text-sm tracking-wide uppercase mt-2 flex items-center justify-center gap-2">
            <span>Masuk Sistem</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </button>
        </form>
      </div>

      <!-- FORM DAFTAR -->
      <div id="daftarSection" class="hidden panel-fade">
        <form id="daftarForm" class="space-y-3.5">
          <div class="grid grid-cols-1 gap-3.5">
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#C8963E]/80 pointer-events-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0c0 .883-.393 1.627-1.08 1.998"></path>
                </svg>
              </span>
              <input type="text" id="regNik" required placeholder="NIK (Username)" class="input-field w-full py-3 pl-10 pr-4 text-sm">
            </div>

            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#C8963E]/80 pointer-events-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </span>
              <input type="text" id="regNama" required placeholder="Nama Lengkap" class="input-field w-full py-3 pl-10 pr-4 text-sm">
            </div>
          </div>

          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#9D446E] pointer-events-none">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
              </svg>
            </span>
            <input type="text" id="regSekolah" required placeholder="Asal Sekolah" class="input-field w-full py-3 pl-10 pr-4 text-sm">
          </div>

          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#C8963E]/80 pointer-events-none">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
              </svg>
            </span>
            <input type="tel" id="regHp" required placeholder="No. WhatsApp (Aktif)" class="input-field w-full py-3 pl-10 pr-4 text-sm">
          </div>

          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#C8963E]/80 pointer-events-none">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </span>
            <input type="password" id="regPass" required placeholder="Buat Password" class="input-field w-full py-3 pl-10 pr-11 text-sm">
            <button type="button" onclick="togglePass('regPass')" aria-label="Tampilkan Password"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[#D5B992]/70 hover:text-[#F4D77D] transition">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>

          <!-- Upload Foto Profil -->
          <div class="bg-[#160F0C]/55 p-3.5 rounded-2xl border border-[#F4D77D]/15">
            <div class="flex items-center gap-3">
              <img id="fotoPreview" src="" alt="Preview" class="hidden w-12 h-12 rounded-full object-cover border-2 border-[#C8963E] shrink-0">
              <div class="flex-1 min-w-0">
                <label for="regFoto" class="text-[10px] text-[#D5B992] uppercase tracking-wider font-semibold mb-1.5 block">
                  Foto Profil (Wajib, Max 2MB)
                </label>
                <input type="file" id="regFoto" accept="image/*" required
                  class="block w-full text-xs text-[#D5B992] file:mr-2.5 file:py-1.5 file:px-3.5 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-[#C8963E] file:text-[#160F0C] hover:file:bg-[#F4D77D] cursor-pointer transition">
              </div>
            </div>
          </div>

          <button type="submit" class="btn-outline-gold w-full py-3.5 text-sm tracking-wide uppercase mt-2">
            Daftar Sekarang
          </button>
        </form>
      </div>

      <!-- TOMBOL LOGOUT / KEMBALI KE BHINNEKASTRA -->
      <div class="mt-6 pt-5 border-t border-[#F4D77D]/15">
        <button type="button" onclick="logout(event)"
          class="w-full py-3 px-4 rounded-full text-xs font-semibold tracking-wide bg-[#9D446E]/20 text-[#F4D77D] border border-[#9D446E]/60 hover:bg-[#9D446E] hover:text-white transition flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
          </svg>
          <span>Logout / Kembali ke Bhinnekastra</span>
        </button>
      </div>

    </div>

    <div class="text-center mt-6 text-[#D5B992]/45 text-[10px] font-semibold tracking-[0.22em] uppercase">
      <p>&copy; DPPI KOTA YOGYAKARTA</p>
    </div>
  </div>

  <script>
    // KONFIGURASI API URL (Menggunakan URL API backend TRIPATI Anda)
    const API_URL = "https://script.google.com/macros/s/AKfycbxInBWqllNbKNNfTa8kY6rpAWIB634SLuA6oilcnKRKIL6Bg2vuHTgi0JanjSnqIS8/exec";
    const BHINNEKASTRA_DETAIL_URL = "https://dppi-pendaftaranbhinnekastra2026.vercel.app/detail.html";

    let isPortalTransitioning = false;

    // Reset overlay jika user kembali menggunakan tombol Back browser (bfcache)
    window.addEventListener('pageshow', () => {
      isPortalTransitioning = false;
      const overlay = document.getElementById('bhinnekastraPortalOverlay');
      if (overlay) {
        overlay.classList.remove('active', 'warping');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }
    });

    function spawnRoseParticles() {
      const container = document.getElementById('bhinnParticles');
      if (!container) return;
      container.innerHTML = '';
      for (let i = 0; i < 22; i++) {
        const spark = document.createElement('span');
        spark.className = 'rose-spark';
        const size = Math.random() * 6 + 3;
        spark.style.width = size + 'px';
        spark.style.height = size + 'px';
        spark.style.left = (Math.random() * 100) + '%';
        spark.style.animationDuration = (Math.random() * 3.5 + 3) + 's';
        spark.style.animationDelay = (Math.random() * 1.8) + 's';
        container.appendChild(spark);
      }
    }

    function animateBhinnPercent(from, to, duration) {
      const el = document.getElementById('bhinnPercentText');
      const start = performance.now();
      function frame(now) {
        const p = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(from + (to - from) * eased) + '%';
        if (p < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function setBhinnPortalStatus(text) {
      const el = document.getElementById('bhinnStatusText');
      el.classList.add('switching');
      setTimeout(() => {
        el.textContent = text;
        el.classList.remove('switching');
      }, 180);
    }

    // FUNGSI LOGOUT / KEMBALI KE DETAIL BHINNEKASTRA DENGAN TRANSISI CINEMATIC
    function logout(e) {
      if (isPortalTransitioning) return;
      isPortalTransitioning = true;

      const overlay = document.getElementById('bhinnekastraPortalOverlay');
      const progressFill = document.getElementById('bhinnProgressFill');
      const step1 = document.getElementById('bStep1');
      const step2 = document.getElementById('bStep2');
      const step3 = document.getElementById('bStep3');

      // Tentukan titik asal ekspansi portal dari koordinat klik tombol
      let originX = '50%';
      let originY = '50%';
      if (e && e.clientX && e.clientY) {
        originX = e.clientX + 'px';
        originY = e.clientY + 'px';
      } else if (e && e.currentTarget) {
        const rect = e.currentTarget.getBoundingClientRect();
        originX = (rect.left + rect.width / 2) + 'px';
        originY = (rect.top + rect.height / 2) + 'px';
      }

      overlay.style.setProperty('--portal-x', originX);
      overlay.style.setProperty('--portal-y', originY);

      // Reset state awal
      progressFill.style.width = '0%';
      document.getElementById('bhinnPercentText').textContent = '0%';
      document.getElementById('bhinnStatusText').textContent = 'Menutup sesi Portal TRIPATI...';
      step1.className = 'bhinn-step-dot active';
      step2.className = 'bhinn-step-dot';
      step3.className = 'bhinn-step-dot';

      spawnRoseParticles();
      document.body.style.overflow = 'hidden';

      // Fase 1: Ekspansi Portal Radial
      overlay.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => {
        overlay.classList.add('active');
      });

      // Fase 2: Tahap 1 (0% -> 38%)
      setTimeout(() => {
        progressFill.style.width = '38%';
        animateBhinnPercent(0, 38, 550);
      }, 320);

      // Fase 3: Tahap 2 (38% -> 76%)
      setTimeout(() => {
        step1.className = 'bhinn-step-dot done';
        step2.className = 'bhinn-step-dot active';
        setBhinnPortalStatus('Menyiapkan halaman profil Bhinnekastra...');
        progressFill.style.width = '76%';
        animateBhinnPercent(38, 76, 600);
      }, 1000);

      // Fase 4: Tahap 3 (76% -> 100%)
      setTimeout(() => {
        step2.className = 'bhinn-step-dot done';
        step3.className = 'bhinn-step-dot active';
        setBhinnPortalStatus('Membuka Portal Bhinnekastra 2026...');
        progressFill.style.width = '100%';
        animateBhinnPercent(76, 100, 500);
      }, 1700);

      // Fase 5: Warp Masuk ke Dunia Bhinnekastra & Redirect
      setTimeout(() => {
        overlay.classList.add('warping');
      }, 2280);

      setTimeout(() => {
        sessionStorage.clear();
        window.location.href = BHINNEKASTRA_DETAIL_URL;
      }, 2620);
    }

    // PRATINJAU FOTO PROFIL SAAT PENDAFTARAN
    document.getElementById('regFoto').addEventListener('change', function(e) {
      const file = e.target.files[0];
      const preview = document.getElementById('fotoPreview');
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          preview.src = ev.target.result;
          preview.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      } else {
        preview.src = '';
        preview.classList.add('hidden');
      }
    });

    // DETEKSI AUTO-LOGIN (SSO) DARI BHINNEKASTRA
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const ssoToken = urlParams.get('sso');

      if (ssoToken) {
        try {
          // Dekode Base64 token
          const decoded = atob(ssoToken);
          const [nik, password] = decoded.split('|||');

          if (nik && password) {
            // Isi form secara otomatis
            document.getElementById('logNik').value = nik;
            document.getElementById('logPass').value = password;

            // Panggil event submit pada form login secara otomatis
            document.getElementById('loginForm').dispatchEvent(new Event('submit', { cancelable: true }));

            // Hapus parameter dari URL agar lebih rapi
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        } catch (e) {
          console.error("SSO Error: Token tidak valid.");
        }
      }
    });

    // FUNGSI GANTI TAB
    function switchTab(mode) {
      const loginSec = document.getElementById('loginSection');
      const daftarSec = document.getElementById('daftarSection');
      const tabLogin = document.getElementById('tabLogin');
      const tabDaftar = document.getElementById('tabDaftar');

      if (mode === 'login') {
        loginSec.classList.remove('hidden');
        daftarSec.classList.add('hidden');

        tabLogin.classList.add('tab-active');
        tabLogin.classList.remove('tab-inactive');

        tabDaftar.classList.remove('tab-active');
        tabDaftar.classList.add('tab-inactive');
      } else {
        loginSec.classList.add('hidden');
        daftarSec.classList.remove('hidden');

        tabDaftar.classList.add('tab-active');
        tabDaftar.classList.remove('tab-inactive');

        tabLogin.classList.remove('tab-active');
        tabLogin.classList.add('tab-inactive');
      }
    }

    // TOGGLE PASSWORD
    function togglePass(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    // 1. LOGIKA LOGIN
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const nik = document.getElementById('logNik').value;
      const pass = document.getElementById('logPass').value;

      Swal.fire({
        title: 'Memproses Login...',
        text: 'Mencocokkan data dengan Database Bhinnekastra...',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "login",
          nik: nik,
          password: pass
        })
      })
      .then(res => res.json())
      .then(response => {
        if (response.success) {
          sessionStorage.setItem('sessionId', response.sessionId);

          Swal.fire({
            icon: 'success',
            title: 'Login Berhasil',
            text: 'Mengalihkan ke Dashboard...',
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            window.location.href = "Home.html";
          });
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Gagal Login',
            text: response.message,
            confirmButtonColor: '#9D446E'
          });
        }
      })
      .catch(() => {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'Terjadi kesalahan koneksi.',
          confirmButtonColor: '#9D446E'
        });
      });
    });

    // 2. LOGIKA PENDAFTARAN (Dengan Upload Foto)
    document.getElementById('daftarForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const fileInput = document.getElementById('regFoto');
      const file = fileInput.files[0];

      // Validasi Ukuran File (Max 2MB)
      if (file.size > 2 * 1024 * 1024) {
        Swal.fire({
          icon: 'warning',
          title: 'File Terlalu Besar',
          text: 'Maksimal ukuran foto adalah 2MB',
          confirmButtonColor: '#C8963E'
        });
        return;
      }

      Swal.fire({
        title: 'Mendaftarkan Akun...',
        text: 'Sedang mengupload foto dan data. Mohon jangan tutup halaman ini.',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      // Baca File sebagai Base64
      const reader = new FileReader();
      reader.onload = function(ev) {
        const fileData = {
          data: ev.target.result.split(',')[1],
          mimeType: file.type,
          name: file.name
        };

        const formObj = {
          nik: document.getElementById('regNik').value,
          nama: document.getElementById('regNama').value,
          sekolah: document.getElementById('regSekolah').value,
          nohp: document.getElementById('regHp').value,
          password: document.getElementById('regPass').value
        };

        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "registerUser",
            formObject: formObj,
            fileData: fileData
          })
        })
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            Swal.fire({
              icon: 'success',
              title: 'Pendaftaran Berhasil!',
              text: res.message,
              confirmButtonColor: '#C8963E'
            }).then(() => {
              document.getElementById('daftarForm').reset();
              const preview = document.getElementById('fotoPreview');
              preview.src = '';
              preview.classList.add('hidden');
              switchTab('login');
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Pendaftaran Gagal',
              text: res.message,
              confirmButtonColor: '#9D446E'
            });
          }
        })
        .catch(err => {
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'Gagal menghubungi server: ' + err.message,
            confirmButtonColor: '#9D446E'
          });
        });
      };

      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
