<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TRIPATI</title>
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/a/a0/Logo_dppi_512.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      background-color: #1A1A1A; 
      color: #F0F0F0;
    }
    
    .animated-bg { background: #1A1A1A; position: relative; }
    
    .shape {
      position: absolute; border-radius: 50%; filter: blur(50px);
      opacity: 0.2; animation: float 25s infinite; z-index: 0;
    }
    .shape-1 { width: 400px; height: 400px; background: #FFD700; top: -150px; left: -150px; }
    .shape-2 { width: 350px; height: 350px; background: #B8860B; bottom: -100px; right: -100px; animation-delay: 5s; }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(40px, -40px) rotate(100deg); }
      66% { transform: translate(-30px, 30px) rotate(200deg); }
    }
    
    .glass-card {
      background: rgba(42, 42, 42, 0.7); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .input-field {
      background-color: #2D2D2D !important; color: #F0F0F0;
      border: 2px solid #3A3A3A !important; transition: all 0.3s ease;
      border-radius: 0.75rem;
    }
    
    .input-field:focus { border-color: #FFD700 !important; outline: none; }
    
    .btn-primary {
      background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
      color: #1A1A1A !important; transition: all 0.3s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(255, 215, 0, 0.4); }

    .gold-text-gradient {
      background: linear-gradient(135deg, #FFD700 30%, #B8860B 80%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* Tab Button Styles */
    .tab-btn { transition: all 0.3s ease; }
    .tab-active { background: #FFD700; color: #1A1A1A; font-weight: bold; }
    .tab-inactive { color: #9CA3AF; hover:text-white; }
  </style>
</head>
<body class="animated-bg min-h-screen flex items-center justify-center p-4 relative">
  
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>

  <div class="w-full max-w-md relative z-10">
    <div class="glass-card rounded-3xl p-8 shadow-2xl">
      
      <div class="flex justify-center mb-4">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/Logo_DPPI.png" alt="Logo" class="h-16 w-auto" style="filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));">
      </div>

      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold gold-text-gradient mb-1 uppercase tracking-tighter">TRIPATI 2026</h2>
        <p class="text-gray-400 text-[10px] uppercase tracking-widest">Sistem Seleksi & Evaluasi Terpadu</p>
      </div>

      <!-- TABS SWITCHER -->
      <div class="flex bg-gray-800/50 p-1 rounded-xl mb-6">
        <button onclick="switchTab('login')" id="tabLogin" class="tab-btn tab-active flex-1 py-2 rounded-lg text-sm">LOGIN</button>
        <button onclick="switchTab('daftar')" id="tabDaftar" class="tab-btn tab-inactive flex-1 py-2 rounded-lg text-sm">DAFTAR</button>
      </div>
      
      <!-- FORM LOGIN -->
      <div id="loginSection">
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="text-xs text-gray-400 ml-1 mb-1 block">NIK / Username</label>
            <input type="text" id="logNik" required placeholder="Masukkan NIK" class="input-field w-full p-3">
          </div>

          <div class="relative">
            <label class="text-xs text-gray-400 ml-1 mb-1 block">Password</label>
            <input type="password" id="logPass" required placeholder="Masukkan Password" class="input-field w-full p-3 pr-10">
            <button type="button" onclick="togglePass('logPass')" class="absolute right-3 top-8 text-gray-400 hover:text-yellow-500">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
            </button>
          </div>

          <button type="submit" class="btn-primary w-full font-bold py-3 rounded-xl shadow-lg mt-4">
            MASUK SISTEM
          </button>
        </form>
      </div>

      <!-- FORM DAFTAR -->
      <div id="daftarSection" class="hidden">
        <form id="daftarForm" class="space-y-3">
          <div class="grid grid-cols-1 gap-3">
            <input type="text" id="regNik" required placeholder="NIK (Username)" class="input-field w-full p-3 text-sm">
            <input type="text" id="regNama" required placeholder="Nama Lengkap" class="input-field w-full p-3 text-sm">
          </div>
          
          <input type="text" id="regSekolah" required placeholder="Asal Sekolah" class="input-field w-full p-3 text-sm">
          <input type="tel" id="regHp" required placeholder="No. WhatsApp (Aktif)" class="input-field w-full p-3 text-sm">
          
          <div class="relative">
            <input type="password" id="regPass" required placeholder="Buat Password" class="input-field w-full p-3 text-sm pr-10">
            <button type="button" onclick="togglePass('regPass')" class="absolute right-3 top-3 text-gray-400 hover:text-yellow-500">
               <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
            </button>
          </div>

          <div class="bg-gray-800/50 p-3 rounded-xl border border-gray-700">
            <label class="text-[10px] text-gray-400 uppercase font-bold mb-1 block">Foto Profil (Wajib, Max 2MB)</label>
            <input type="file" id="regFoto" accept="image/*" required class="block w-full text-xs text-gray-300 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-yellow-500 file:text-black hover:file:bg-yellow-600 cursor-pointer">
          </div>

          <button type="submit" class="w-full py-3 rounded-xl border border-yellow-500 text-yellow-500 font-bold hover:bg-yellow-500 hover:text-black transition shadow-lg mt-2 text-sm">
            DAFTAR SEKARANG
          </button>
        </form>
      </div>

    </div>
    
    <div class="text-center mt-6 text-gray-500 text-[10px] font-bold tracking-[0.2em] uppercase">
      <p>© DPPI KOTA YOGYAKARTA</p>
    </div>
  </div>

  <script>
    // KONFIGURASI API URL (GANTI DENGAN URL APPS SCRIPT ANDA)
    const API_URL = "https://script.google.com/macros/s/AKfycbyCGN5P5kqs-e7AuRVgbUKxtXflsjLR5PCPDs5AbgGywPvhJfxzlBmnhKrz-0lq6Tlq/exec"; 

    // FUNGSI GANTI TAB
    function switchTab(mode) {
      const loginSec = document.getElementById('loginSection');
      const daftarSec = document.getElementById('daftarSection');
      const tabLogin = document.getElementById('tabLogin');
      const tabDaftar = document.getElementById('tabDaftar');

      if(mode === 'login') {
        loginSec.classList.remove('hidden');
        daftarSec.classList.add('hidden');
        
        tabLogin.classList.add('tab-active');
        tabLogin.classList.remove('tab-inactive');
        
        tabDaftar.classList.remove('tab-active');
        tabDaftar.classList.add('tab-inactive');
      } else {
        loginSec.classList.add('hidden');
        daftarSec.classList.remove('hidden');
        
        tabDaftar.classList.add('tab-active');
        tabDaftar.classList.remove('tab-inactive');
        
        tabLogin.classList.remove('tab-active');
        tabLogin.classList.add('tab-inactive');
      }
    }

    // TOGGLE PASSWORD
    function togglePass(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    // 1. LOGIKA LOGIN
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const nik = document.getElementById('logNik').value;
      const pass = document.getElementById('logPass').value;

      Swal.fire({
        title: 'Memproses Login...',
        text: 'Mohon tunggu sebentar',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading(),
        background: '#1F2937', color: '#fff'
      });

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "login",
          nik: nik,
          password: pass
        })
      })
      .then(res => res.json())
      .then(response => {
          if (response.success) {
            // Simpan Session ID
            sessionStorage.setItem('sessionId', response.sessionId);
            
            Swal.fire({
              icon: 'success', title: 'Login Berhasil',
              text: 'Mengalihkan ke Dashboard...',
              timer: 1500, showConfirmButton: false,
              background: '#1F2937', color: '#fff'
            }).then(() => {
               // REDIRECT KE HALAMAN HOME DI VERCEL
               window.location.href = "Home.html";
            });
          } else {
            Swal.fire({
              icon: 'error', title: 'Gagal Login',
              text: response.message,
              background: '#1F2937', color: '#fff', confirmButtonColor: '#d33'
            });
          }
      })
      .catch(err => {
          Swal.fire('Error', 'Terjadi kesalahan koneksi.', 'error');
      });
    });

    // 2. LOGIKA PENDAFTARAN (Dengan Upload Foto)
    document.getElementById('daftarForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const fileInput = document.getElementById('regFoto');
      const file = fileInput.files[0];

      // Validasi Ukuran File (Max 2MB)
      if(file.size > 2 * 1024 * 1024) {
         Swal.fire({
           icon: 'warning', title: 'File Terlalu Besar',
           text: 'Maksimal ukuran foto adalah 2MB',
           background: '#1F2937', color: '#fff'
         });
         return;
      }

      Swal.fire({
        title: 'Mendaftarkan Akun...',
        text: 'Sedang mengupload foto dan data. Mohon jangan tutup halaman ini.',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading(),
        background: '#1F2937', color: '#fff'
      });

      // Baca File sebagai Base64
      const reader = new FileReader();
      reader.onload = function(e) {
        const fileData = {
          data: e.target.result.split(',')[1], // Ambil base64 string setelah koma
          mimeType: file.type,
          name: file.name
        };
        
        const formObj = {
          nik: document.getElementById('regNik').value,
          nama: document.getElementById('regNama').value,
          sekolah: document.getElementById('regSekolah').value,
          nohp: document.getElementById('regHp').value,
          password: document.getElementById('regPass').value
        };

        // Kirim ke Backend via Fetch
        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "registerUser",
            formObject: formObj,
            fileData: fileData
          })
        })
        .then(res => res.json())
        .then(res => {
             if(res.success) {
               Swal.fire({
                 icon: 'success', title: 'Pendaftaran Berhasil!',
                 text: res.message, // Pesan: Tunggu verifikasi admin
                 background: '#1F2937', color: '#fff',
                 confirmButtonColor: '#B8860B'
               }).then(() => {
                 // Reset form dan pindah ke tab Login
                 document.getElementById('daftarForm').reset();
                 switchTab('login');
               });
             } else {
               Swal.fire({
                 icon: 'error', title: 'Pendaftaran Gagal',
                 text: res.message,
                 background: '#1F2937', color: '#fff'
               });
             }
        })
        .catch(err => {
             Swal.fire('Error', 'Gagal menghubungi server: ' + err.message, 'error');
        });
      };
      
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
