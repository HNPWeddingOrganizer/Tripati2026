<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Portal TRIPATI DPPI</title>
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/a/a0/Logo_dppi_512.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Premium Earthy Palette */
      --bg-main: #160F0C;
      --glass-bg: rgba(45, 30, 25, 0.45);
      --glass-bg-card: rgba(36, 24, 19, 0.65);
      --glass-border: rgba(244, 215, 125, 0.16);
      --color-primary: #C8963E;
      --color-primary-hover: #A87B32;
      --color-accent: #9D446E;
      --text-main: #F4D77D;
      --text-muted: #D5B992;
      --text-reading: #F5EFE6;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-reading);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    /* --- BACKGROUND ANIMATED SHAPES --- */
    .bg-shapes {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.48;
      animation: float 20s infinite alternate ease-in-out;
    }

    .shape-1 {
      width: 500px;
      height: 500px;
      background: rgba(200, 150, 62, 0.25);
      top: -20%;
      left: -10%;
    }

    .shape-2 {
      width: 400px;
      height: 400px;
      background: rgba(157, 68, 110, 0.25);
      bottom: -10%;
      right: -10%;
      animation-delay: -7s;
    }

    .shape-3 {
      width: 350px;
      height: 350px;
      background: rgba(243, 146, 104, 0.2);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -12s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.1); }
      100% { transform: translate(-40px, 60px) scale(0.9); }
    }

    /* --- GLASSMORPHISM CARD --- */
    .glass-container {
      background: var(--glass-bg-card);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 32px;
      box-shadow: 0 25px 55px -12px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      animation: fadeIn 0.75s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- LOGO & ANIMATED RINGS --- */
    .logo-wrapper {
      position: relative;
      width: 108px;
      height: 108px;
      margin: 0 auto 18px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: contain;
      background-color: rgba(22, 15, 12, 0.85);
      border: 1px solid rgba(244, 215, 125, 0.28);
      padding: 6px;
      box-shadow: 0 8px 30px rgba(200, 150, 62, 0.3);
      position: relative;
      z-index: 2;
    }

    .rings {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(244, 215, 125, 0.12);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .ring-1 {
      width: 102px;
      height: 102px;
      animation: ping-ring 3s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .ring-2 {
      width: 128px;
      height: 128px;
      border-color: rgba(244, 215, 125, 0.06);
      animation: ping-ring 3s cubic-bezier(0, 0, 0.2, 1) infinite;
      animation-delay: 0.55s;
    }

    .ring-3 {
      width: 118px;
      height: 118px;
      border-style: dashed;
      border-color: rgba(244, 215, 125, 0.14);
      animation: spin-slow 16s linear infinite;
    }

    @keyframes ping-ring {
      75%, 100% {
        transform: translate(-50%, -50%) scale(1.4);
        opacity: 0;
      }
    }

    @keyframes spin-slow {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* --- TYPOGRAPHY --- */
    .title-gradient {
      background: linear-gradient(to right, #F4D77D, #C8963E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* --- TABS SWITCHER --- */
    .tabs-wrapper {
      background: rgba(22, 15, 12, 0.58);
      border: 1px solid rgba(244, 215, 125, 0.14);
      border-radius: 100px;
      padding: 4px;
    }

    .tab-btn {
      border-radius: 100px;
      transition: all 0.25s ease;
    }

    .tab-active {
      background: linear-gradient(135deg, #F4D77D 0%, #C8963E 100%);
      color: #160F0C;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(200, 150, 62, 0.3);
    }

    .tab-inactive {
      color: var(--text-muted);
      font-weight: 600;
    }

    .tab-inactive:hover {
      color: var(--text-main);
    }

    /* --- INPUTS --- */
    .input-field {
      background-color: rgba(22, 15, 12, 0.62) !important;
      color: var(--text-reading);
      border: 1.5px solid rgba(244, 215, 125, 0.16) !important;
      border-radius: 16px;
      transition: all 0.25s ease;
    }

    .input-field::placeholder {
      color: rgba(213, 185, 146, 0.45);
    }

    .input-field:focus {
      border-color: var(--color-primary) !important;
      box-shadow: 0 0 0 3px rgba(200, 150, 62, 0.18);
      outline: none;
    }

    /* --- BUTTONS --- */
    .btn-gold {
      background: linear-gradient(135deg, #F4D77D 0%, #C8963E 100%);
      color: #160F0C !important;
      border-radius: 100px;
      font-weight: 700;
      transition: all 0.25s ease;
      box-shadow: 0 12px 28px rgba(200, 150, 62, 0.28);
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(200, 150, 62, 0.44);
      filter: brightness(1.05);
    }

    .btn-outline-gold {
      background: rgba(200, 150, 62, 0.08);
      color: var(--text-main);
      border: 1.5px solid var(--color-primary);
      border-radius: 100px;
      font-weight: 700;
      transition: all 0.25s ease;
    }

    .btn-outline-gold:hover {
      background: linear-gradient(135deg, #F4D77D 0%, #C8963E 100%);
      color: #160F0C;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(200, 150, 62, 0.35);
    }

    .panel-fade {
      animation: panelFade 0.3s ease forwards;
    }

    @keyframes panelFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- SWEETALERT2 EARTHY OVERRIDE --- */
    .swal2-popup {
      background: rgba(34, 22, 18, 0.96) !important;
      border: 1px solid rgba(244, 215, 125, 0.22) !important;
      border-radius: 28px !important;
      color: #F4D77D !important;
      backdrop-filter: blur(20px);
    }

    .swal2-title {
      color: #F4D77D !important;
    }

    .swal2-html-container {
      color: #D5B992 !important;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative">

  <!-- Background Shapes (Glassmorphism Blobs) -->
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="w-full max-w-md relative z-10 my-4">
    <div class="glass-container p-7 sm:p-8">

      <!-- Logo & Animated Rings -->
      <div class="logo-wrapper">
        <div class="rings ring-1"></div>
        <div class="rings ring-2"></div>
        <div class="rings ring-3"></div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/Logo_DPPI.png" alt="Logo DPPI" class="main-logo"
          onerror="this.src='https://placehold.co/100/160F0C/F4D77D?text=DPPI'">
      </div>

      <!-- Heading -->
      <div class="text-center mb-6">
        <h2 class="text-2xl sm:text-[26px] font-extrabold title-gradient tracking-tight mb-1 uppercase">TRIPATI 2025</h2>
        <p class="text-[#D5B992]/80 text-[11px] font-medium uppercase tracking-[0.18em]">Sistem Seleksi & Evaluasi Terpadu</p>
      </div>

      <!-- TABS SWITCHER -->
      <div class="flex tabs-wrapper mb-6">
        <button type="button" onclick="switchTab('login')" id="tabLogin" class="tab-btn tab-active flex-1 py-2.5 text-xs tracking-wider uppercase">
          Login
        </button>
        <button type="button" onclick="switchTab('daftar')" id="tabDaftar" class="tab-btn tab-inactive flex-1 py-2.5 text-xs tracking-wider uppercase">
          Daftar
        </button>
      </div>

      <!-- FORM LOGIN -->
      <div id="loginSection" class="panel-fade">
        <form id="loginForm" class="space-y-4">
          <div>
            <label for="logNik" class="text-xs font-medium text-[#D5B992] ml-1 mb-1.5 block">NIK / Username</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#C8963E]/80 pointer-events-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </span>
              <input type="text" id="logNik" required placeholder="Masukkan NIK" class="input-field w-full py-3 pl-10 pr-4 text-sm">
            </div>
          </div>

          <div>
            <label for="logPass" class="text-xs font-medium text-[#D5B992] ml-1 mb-1.5 block">Password</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#C8963E]/80 pointer-events-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
              </span>
              <input type="password" id="logPass" required placeholder="Masukkan Password" class="input-field w-full py-3 pl-10 pr-11 text-sm">
              <button type="button" onclick="togglePass('logPass')" aria-label="Tampilkan Password"
                class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[#D5B992]/70 hover:text-[#F4D77D] transition">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-gold w-full py-3.5 text-sm tracking-wide uppercase mt-2 flex items-center justify-center gap-2">
            <span>Masuk Sistem</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </button>
        </form>
      </div>

      <!-- FORM DAFTAR -->
      <div id="daftarSection" class="hidden panel-fade">
        <form id="daftarForm" class="space-y-3.5">
          <div class="grid grid-cols-1 gap-3.5">
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#C8963E]/80 pointer-events-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0c0 .883-.393 1.627-1.08 1.998"></path>
                </svg>
              </span>
              <input type="text" id="regNik" required placeholder="NIK (Username)" class="input-field w-full py-3 pl-10 pr-4 text-sm">
            </div>

            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#C8963E]/80 pointer-events-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </span>
              <input type="text" id="regNama" required placeholder="Nama Lengkap" class="input-field w-full py-3 pl-10 pr-4 text-sm">
            </div>
          </div>

          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#9D446E] pointer-events-none">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
              </svg>
            </span>
            <input type="text" id="regSekolah" required placeholder="Asal Sekolah" class="input-field w-full py-3 pl-10 pr-4 text-sm">
          </div>

          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#C8963E]/80 pointer-events-none">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
              </svg>
            </span>
            <input type="tel" id="regHp" required placeholder="No. WhatsApp (Aktif)" class="input-field w-full py-3 pl-10 pr-4 text-sm">
          </div>

          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#C8963E]/80 pointer-events-none">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </span>
            <input type="password" id="regPass" required placeholder="Buat Password" class="input-field w-full py-3 pl-10 pr-11 text-sm">
            <button type="button" onclick="togglePass('regPass')" aria-label="Tampilkan Password"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[#D5B992]/70 hover:text-[#F4D77D] transition">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>

          <!-- Upload Foto Profil -->
          <div class="bg-[#160F0C]/55 p-3.5 rounded-2xl border border-[#F4D77D]/15">
            <div class="flex items-center gap-3">
              <img id="fotoPreview" src="" alt="Preview" class="hidden w-12 h-12 rounded-full object-cover border-2 border-[#C8963E] shrink-0">
              <div class="flex-1 min-w-0">
                <label for="regFoto" class="text-[10px] text-[#D5B992] uppercase tracking-wider font-semibold mb-1.5 block">
                  Foto Profil (Wajib, Max 2MB)
                </label>
                <input type="file" id="regFoto" accept="image/*" required
                  class="block w-full text-xs text-[#D5B992] file:mr-2.5 file:py-1.5 file:px-3.5 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-[#C8963E] file:text-[#160F0C] hover:file:bg-[#F4D77D] cursor-pointer transition">
              </div>
            </div>
          </div>

          <button type="submit" class="btn-outline-gold w-full py-3.5 text-sm tracking-wide uppercase mt-2">
            Daftar Sekarang
          </button>
        </form>
      </div>

    </div>

    <div class="text-center mt-6 text-[#D5B992]/45 text-[10px] font-semibold tracking-[0.22em] uppercase">
      <p>&copy; DPPI KOTA YOGYAKARTA</p>
    </div>
  </div>

  <script>
    // KONFIGURASI API URL (Menggunakan URL API backend TRIPATI Anda)
    // PENTING: Backend (kode_2.gs Anda) HARUS diubah agar membaca dari SPREADSHEET_ID Bhinnekastra
    const API_URL = "https://script.google.com/macros/s/AKfycbzMNz3nK-4mjMLYVLtsd_aw2TiKV5g5JHS5SbLIRDqgn-J6EFdZJ8vG20RwOJ-4R-3o/exec";

    // PRATINJAU FOTO PROFIL SAAT PENDAFTARAN
    document.getElementById('regFoto').addEventListener('change', function(e) {
      const file = e.target.files[0];
      const preview = document.getElementById('fotoPreview');
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          preview.src = ev.target.result;
          preview.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      } else {
        preview.src = '';
        preview.classList.add('hidden');
      }
    });

    // DETEKSI AUTO-LOGIN (SSO) DARI BHINNEKASTRA
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const ssoToken = urlParams.get('sso');

      if (ssoToken) {
        try {
          // Dekode Base64 token
          const decoded = atob(ssoToken);
          const [nik, password] = decoded.split('|||');

          if (nik && password) {
            // Isi form secara otomatis
            document.getElementById('logNik').value = nik;
            document.getElementById('logPass').value = password;

            // Panggil event submit pada form login secara otomatis
            document.getElementById('loginForm').dispatchEvent(new Event('submit', { cancelable: true }));

            // Hapus parameter dari URL agar lebih rapi
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        } catch (e) {
          console.error("SSO Error: Token tidak valid.");
        }
      }
    });

    // FUNGSI GANTI TAB
    function switchTab(mode) {
      const loginSec = document.getElementById('loginSection');
      const daftarSec = document.getElementById('daftarSection');
      const tabLogin = document.getElementById('tabLogin');
      const tabDaftar = document.getElementById('tabDaftar');

      if (mode === 'login') {
        loginSec.classList.remove('hidden');
        daftarSec.classList.add('hidden');

        tabLogin.classList.add('tab-active');
        tabLogin.classList.remove('tab-inactive');

        tabDaftar.classList.remove('tab-active');
        tabDaftar.classList.add('tab-inactive');
      } else {
        loginSec.classList.add('hidden');
        daftarSec.classList.remove('hidden');

        tabDaftar.classList.add('tab-active');
        tabDaftar.classList.remove('tab-inactive');

        tabLogin.classList.remove('tab-active');
        tabLogin.classList.add('tab-inactive');
      }
    }

    // TOGGLE PASSWORD
    function togglePass(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    // 1. LOGIKA LOGIN
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const nik = document.getElementById('logNik').value;
      const pass = document.getElementById('logPass').value;

      Swal.fire({
        title: 'Memproses Login...',
        text: 'Mencocokkan data dengan Database Bhinnekastra...',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "login",
          nik: nik,
          password: pass
        })
      })
      .then(res => res.json())
      .then(response => {
        if (response.success) {
          sessionStorage.setItem('sessionId', response.sessionId);

          Swal.fire({
            icon: 'success',
            title: 'Login Berhasil',
            text: 'Mengalihkan ke Dashboard...',
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            window.location.href = "Home.html";
          });
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Gagal Login',
            text: response.message,
            confirmButtonColor: '#9D446E'
          });
        }
      })
      .catch(() => {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'Terjadi kesalahan koneksi.',
          confirmButtonColor: '#9D446E'
        });
      });
    });

    // 2. LOGIKA PENDAFTARAN (Dengan Upload Foto)
    document.getElementById('daftarForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const fileInput = document.getElementById('regFoto');
      const file = fileInput.files[0];

      // Validasi Ukuran File (Max 2MB)
      if (file.size > 2 * 1024 * 1024) {
        Swal.fire({
          icon: 'warning',
          title: 'File Terlalu Besar',
          text: 'Maksimal ukuran foto adalah 2MB',
          confirmButtonColor: '#C8963E'
        });
        return;
      }

      Swal.fire({
        title: 'Mendaftarkan Akun...',
        text: 'Sedang mengupload foto dan data. Mohon jangan tutup halaman ini.',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      // Baca File sebagai Base64
      const reader = new FileReader();
      reader.onload = function(ev) {
        const fileData = {
          data: ev.target.result.split(',')[1],
          mimeType: file.type,
          name: file.name
        };

        const formObj = {
          nik: document.getElementById('regNik').value,
          nama: document.getElementById('regNama').value,
          sekolah: document.getElementById('regSekolah').value,
          nohp: document.getElementById('regHp').value,
          password: document.getElementById('regPass').value
        };

        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "registerUser",
            formObject: formObj,
            fileData: fileData
          })
        })
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            Swal.fire({
              icon: 'success',
              title: 'Pendaftaran Berhasil!',
              text: res.message,
              confirmButtonColor: '#C8963E'
            }).then(() => {
              document.getElementById('daftarForm').reset();
              const preview = document.getElementById('fotoPreview');
              preview.src = '';
              preview.classList.add('hidden');
              switchTab('login');
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Pendaftaran Gagal',
              text: res.message,
              confirmButtonColor: '#9D446E'
            });
          }
        })
        .catch(err => {
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'Gagal menghubungi server: ' + err.message,
            confirmButtonColor: '#9D446E'
          });
        });
      };

      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
