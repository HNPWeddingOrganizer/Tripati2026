<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Ujian</title>
     <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/a/a0/Logo_dppi_512.png">
  <link rel="shortcut icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/a/a0/Logo_dppi_512.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #1A1A1A; }
        .gold-gradient-bg { background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%); }
        .fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-[#1A1A1A] min-h-screen text-gray-100 flex items-center justify-center p-4">

    <div id="mainContainer" class="bg-gray-900 rounded-2xl shadow-2xl w-full max-w-2xl p-6 md:p-8 border-t-8 border-yellow-500 fade-in hidden">
        <div class="text-center mb-8">
            <div id="iconContainer" class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 bg-gray-800"></div>
            <h1 class="text-2xl md:text-3xl font-bold text-yellow-500 mb-1">Hasil Ujian <span id="labelJenisUjian"></span></h1>
            <p class="text-gray-400 text-sm">Ringkasan hasil evaluasi Anda</p>
        </div>

        <!-- Data Peserta -->
        <div class="bg-gray-800 rounded-xl p-4 mb-6 border border-gray-700 text-sm md:text-base">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <p class="text-xs text-gray-500 uppercase tracking-wider">Nama Peserta</p>
                    <p class="font-semibold text-gray-200" id="namaPeserta">-</p>
                </div>
                <div>
                    <p class="text-xs text-gray-500 uppercase tracking-wider">Nomor Peserta</p>
                    <p class="font-semibold text-gray-200" id="noPeserta">-</p>
                </div>
            </div>
        </div>

        <!-- Nilai Utama -->
        <div class="gold-gradient-bg rounded-xl p-6 text-gray-900 mb-6 shadow-xl text-center">
            <p class="text-sm font-bold uppercase tracking-widest opacity-80">Nilai Akhir</p>
            <p class="text-6xl font-black my-2 drop-shadow-md" id="nilaiAkhir">0</p>
            <div class="flex justify-center gap-6 text-xs font-bold uppercase">
                <div class="bg-white/20 px-3 py-1 rounded-lg">Benar: <span id="jumlahBenar">-</span></div>
                <div class="bg-white/20 px-3 py-1 rounded-lg">Salah: <span id="jumlahSalah">-</span></div>
                <div class="bg-white/20 px-3 py-1 rounded-lg">Total: <span id="totalSoal">-</span></div>
            </div>
        </div>

        <!-- Status Kelulusan -->
        <div id="statusKelulusan" class="rounded-xl p-4 mb-6 text-center border-2 border-yellow-500 bg-gray-800 text-sm"></div>

        <!-- Tombol Aksi -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 no-print">
             <!-- Tombol Lihat Pembahasan -->
            <button id="btnPembahasan" onclick="bukaPembahasan()" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                Lihat Pembahasan
            </button>
            <button onclick="window.print()" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-xl transition flex items-center justify-center gap-2 w-full">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m0 0v2a2 2 0 002 2h6a2 2 0 002-2v-2M9 14h6"></path></svg>
                Cetak Hasil
            </button>
            <button onclick="kembaliKeHome()" class="md:col-span-2 gold-gradient-bg text-gray-900 font-extrabold py-3 px-6 rounded-xl transition hover:scale-[1.02] shadow-lg flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                KEMBALI KE BERANDA
            </button>
        </div>
    </div>

    <!-- MODAL PEMBAHASAN -->
    <div id="modalPembahasan" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col p-2 md:p-8">
        <div class="max-w-4xl w-full mx-auto bg-gray-900 rounded-2xl overflow-hidden flex flex-col h-full border border-yellow-600/30 shadow-2xl">
            <div class="gold-gradient-bg p-4 flex justify-between items-center shrink-0">
                <h2 class="text-gray-900 font-bold flex items-center gap-2 text-sm md:text-base">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    Review Pembahasan Soal
                </h2>
                <button onclick="tutupPembahasan()" class="bg-black/20 hover:bg-black/40 text-gray-900 p-1 rounded-full transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="kontenPembahasan" class="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar space-y-6 bg-[#0F0F0F]">
                <!-- List Pembahasan akan diisi JS -->
            </div>
            <div class="p-4 bg-gray-900 border-t border-gray-800 text-center shrink-0">
                <button onclick="tutupPembahasan()" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-8 rounded-lg transition border border-gray-700">Tutup Review</button>
            </div>
        </div>
    </div>

    <!-- LOADER -->
    <div id="loader" class="text-center">
       <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-yellow-500 mb-4"></div>
       <p class="text-yellow-500">Memuat Data Hasil...</p>
    </div>

    <script>
        // KONFIGURASI API URL (GANTI DENGAN URL APPS SCRIPT ANDA)
        const API_URL = "https://script.google.com/macros/s/AKfycbyCGN5P5kqs-e7AuRVgbUKxtXflsjLR5PCPDs5AbgGywPvhJfxzlBmnhKrz-0lq6Tlq/exec"; 

        // AMBIL PARAMETER DARI URL VERCEL
        const urlParams = new URLSearchParams(window.location.search);
        let jenisUjian = urlParams.get('jenis');
        if (!jenisUjian || jenisUjian === "undefined") jenisUjian = 'PIP';

        document.getElementById('labelJenisUjian').textContent = jenisUjian;

        function logout() {
            sessionStorage.clear();
            window.location.href = "Index.html";
        }

        function kembaliKeHome() {
            window.location.href = "Home.html";
        }

        // --- LOGIKA UTAMA MEMUAT HALAMAN ---
        function loadHasil() {
            const sid = sessionStorage.getItem('sessionId');
            
            // Cek session storage untuk data yang baru disubmit
            const hRaw = sessionStorage.getItem('hasilUjian_' + jenisUjian);
            const pRaw = sessionStorage.getItem('peserta');
            const soalRaw = sessionStorage.getItem('soalData_' + jenisUjian);

            // 1. Jika User BARU SAJA SELESAI UJIAN (Data Lengkap di Local Storage)
            if (hRaw && pRaw && soalRaw) {
                renderUI(JSON.parse(pRaw), JSON.parse(hRaw));
                enablePembahasanButton();
            } 
            // 2. Jika User LOGIN ULANG atau REFRESH (Ambil Data dari Server)
            else if (sid) {
                 const pLocal = pRaw ? JSON.parse(pRaw) : null;
                 
                 if(pLocal && pLocal.noPeserta) {
                    fetchServerData(pLocal.noPeserta);
                 } else {
                    fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "getUserSession", sessionId: sid })
                    })
                    .then(res => res.json())
                    .then(res => {
                        if(res.success) {
                            fetchServerData(res.data.nik); // asumsikan res.data.nik adalah nomor peserta
                        } else {
                            logout();
                        }
                    })
                    .catch(() => logout());
                 }
            } else {
                logout(); // Tidak ada sesi
            }
        }
        
        // Mengambil Statistik Nilai dari Server
        function fetchServerData(noPeserta) {
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getDataHasilSiswa", noPeserta: noPeserta, jenis: jenisUjian })
            })
            .then(res => res.json())
            .then(res => {
                if(res.success) {
                    const hasilServer = {
                        nilai: res.nilai,
                        benar: res.benar,
                        salah: res.salah,
                        totalSoal: res.totalSoal
                    };
                    const pesertaServer = {
                        nama: res.nama || '-', // Di isi jika API mereturn nama
                        noPeserta: noPeserta
                    };
                    sessionStorage.setItem('peserta', JSON.stringify(pesertaServer));
                    
                    renderUI(pesertaServer, hasilServer);
                    
                    // Ambil Soal dari Server (untuk pembahasan) jika belum ada di cache
                    if (!sessionStorage.getItem('soalData_' + jenisUjian)) {
                        fetch(API_URL, {
                            method: "POST",
                            body: JSON.stringify({ action: "loadSoal", jenis: jenisUjian })
                        })
                        .then(r => r.json())
                        .then(dataSoal => {
                            if (dataSoal.success && dataSoal.data) {
                                sessionStorage.setItem('soalData_' + jenisUjian, JSON.stringify(dataSoal.data));
                                enablePembahasanButton();
                            }
                        });
                    } else {
                        enablePembahasanButton();
                    }
                } else {
                    Swal.fire('Error', res.message, 'error').then(kembaliKeHome);
                }
            })
            .catch(err => {
                Swal.fire('Error', err.message, 'error').then(kembaliKeHome);
            });
        }

        function enablePembahasanButton() {
            const btn = document.getElementById('btnPembahasan');
            btn.classList.remove('hidden');
            btn.classList.add('flex');
        }

        function renderUI(p, h) {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('mainContainer').classList.remove('hidden');

            document.getElementById('namaPeserta').textContent = p.nama || '-';
            document.getElementById('noPeserta').textContent = p.noPeserta || '-';

            const n = h.nilai || 0, b = h.benar, s = h.salah, t = h.totalSoal, kkm = 75; 
            document.getElementById('nilaiAkhir').textContent = n;
            document.getElementById('jumlahBenar').textContent = (b !== undefined) ? b : '-';
            document.getElementById('jumlahSalah').textContent = (s !== undefined) ? s : '-';
            document.getElementById('totalSoal').textContent = (t !== undefined) ? t : '-';

            const status = document.getElementById('statusKelulusan');
            const icon = document.getElementById('iconContainer');

            if (n >= kkm) {
                status.className = 'rounded-xl p-4 mb-6 text-center border border-green-500/30 bg-green-500/5 text-green-400';
                status.innerHTML = `<p class="font-bold text-lg mb-1">🎉 SELAMAT, ANDA LULUS!</p><p class="text-xs opacity-80">Nilai Anda memenuhi standar kelulusan.</p>`;
                icon.className = 'w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 bg-green-600 shadow-xl shadow-green-900/20';
                icon.innerHTML = '<svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>';
            } else {
                status.className = 'rounded-xl p-4 mb-6 text-center border border-red-500/30 bg-red-500/5 text-red-400';
                status.innerHTML = `<p class="font-bold text-lg mb-1">BELUM LULUS</p><p class="text-xs opacity-80">Nilai Anda belum memenuhi standar kelulusan KKM 75.</p>`;
                icon.className = 'w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 bg-red-600 shadow-xl shadow-red-900/20';
                icon.innerHTML = '<svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>';
            }
        }

        // --- LOGIKA MODAL PEMBAHASAN ---
        function bukaPembahasan() {
            document.getElementById('modalPembahasan').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            renderPembahasan();
        }

        function tutupPembahasan() {
            document.getElementById('modalPembahasan').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function renderGambar(url) {
            if (!url || url === '-' || url.trim() === '') return '';
            return `
                <div class="my-4 text-center">
                    <img src="${url}" 
                         alt="Gambar Soal"
                         class="mx-auto rounded-xl border border-gray-700 max-h-72 object-contain bg-black/30"
                         loading="lazy" onerror="this.style.display='none'">
                </div>
            `;
        }

        function renderPembahasanDenganGambar(text) {
            if (!text || text === '-' || text.trim() === '') {
                return 'Penjelasan untuk soal ini tidak tersedia.';
            }
            return text.replace(
                /(https?:\/\/.*\.(png|jpg|jpeg|gif|webp))/gi,
                (url) => `
                    <div class="my-4 text-center">
                        <img src="${url}" class="mx-auto rounded-xl border border-gray-700 max-h-80 object-contain bg-black/30" loading="lazy">
                    </div>`
            );
        }

        function renderPembahasan() {
            const container = document.getElementById('kontenPembahasan');
            container.innerHTML = '<div class="text-center py-10"><div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-yellow-500 mb-2"></div><p class="text-gray-500">Memuat data...</p></div>';

            const soalDataRaw = sessionStorage.getItem('soalData_' + jenisUjian);
            const hasilRaw = sessionStorage.getItem('hasilUjian_' + jenisUjian);
            
            if (!soalDataRaw) {
                container.innerHTML = '<div class="text-center py-10 text-red-400">Data soal tidak ditemukan. Silakan refresh halaman.</div>';
                return;
            }

            const soalData = JSON.parse(soalDataRaw);
            const hasil = hasilRaw ? JSON.parse(hasilRaw) : {};
            const jawabanPeserta = hasil.jawabanDetail || {};
            const statusJawaban = hasil.statusJawaban || {};

            container.innerHTML = '';

            soalData.forEach((soal, index) => {
                const userJawab = jawabanPeserta[soal.no] || null;
                const isCorrect = userJawab ? (statusJawaban[soal.no] === true) : false;
                
                const item = document.createElement('div');
                item.className = `p-5 rounded-xl border border-gray-800 ${isCorrect ? 'bg-green-500/5' : 'bg-red-500/5'} transition-all hover:border-gray-700`;
                
                item.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <span class="bg-gray-800 text-yellow-500 px-3 py-1 rounded-lg text-[10px] font-bold uppercase tracking-wider border border-gray-700">Soal ${index + 1}</span>
                        <div class="flex items-center gap-2">
                            ${isCorrect ? 
                                '<span class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-[10px] font-bold border border-green-500/30 flex items-center gap-1">TEPAT</span>' : 
                                '<span class="bg-red-500/20 text-red-400 px-3 py-1 rounded-full text-[10px] font-bold border border-red-500/30 flex items-center gap-1">KURANG TEPAT</span>'}
                        </div>
                    </div>
                    
                    <p class="text-gray-200 mb-3 leading-relaxed text-sm md:text-base font-medium">${soal.pertanyaan}</p>
                    ${renderGambar(soal.gambar)}

                    <div class="grid grid-cols-1 gap-2 mb-5 text-sm">
                        ${['A', 'B', 'C', 'D'].map(opt => `
                            <div class="p-3 rounded-lg border transition-all duration-300 flex items-start gap-2
                                ${soal.kunci === opt 
                                    ? 'bg-green-500/10 border-green-500 text-green-400' 
                                    : (userJawab === opt 
                                        ? 'bg-red-500/10 border-red-500 text-red-400' 
                                        : 'bg-gray-800 border-gray-700 text-gray-400')}">
                                <span class="font-bold min-w-[20px]">${opt}.</span>
                                <span>${soal['opsi'+opt]}</span>
                                <span class="ml-auto font-bold">
                                    ${soal.kunci === opt ? '✔' : (userJawab === opt ? '✖' : '')}
                                </span>
                            </div>
                        `).join('')}
                    </div>

                    <div class="p-4 rounded-xl bg-yellow-500/5 border border-yellow-500/10">
                        <p class="text-yellow-600 text-[10px] uppercase font-black mb-2 flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Pembahasan:
                        </p>
                        <div class="text-gray-400 text-xs md:text-sm leading-relaxed space-y-3">
                            ${renderPembahasanDenganGambar(soal.pembahasan)}
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        window.onload = loadHasil;
    </script>
</body>
</html>
